# R9 Analytics Theme
# Catppuccin Latte (light) + Mocha (dark)

[theme]
base = "light"

# Typography
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeFontSize = "0.85rem"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["32px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [600, 600, 600, 500, 500, 500]
linkUnderline = false
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"

# Catppuccin chart palette (Latte/Mocha shared accent colors)
chartCategoricalColors = ["#1e66f5", "#8839ef", "#ea76cb", "#d20f39", "#fe640b", "#df8e1d", "#40a02b", "#179299", "#04a5e5", "#7287fd"]

# Semantic colors (Mocha accents for both modes)
grayColor = "#9399b2"
blueColor = "#89b4fa"
greenColor = "#a6e3a1"
redColor = "#f38ba8"
yellowColor = "#f9e2af"
orangeColor = "#fab387"
violetColor = "#cba6f7"

[theme.light]
# Catppuccin Latte
primaryColor = "#1e66f5"
backgroundColor = "#eff1f5"
secondaryBackgroundColor = "#e6e9ef"
codeBackgroundColor = "#dce0e8"
textColor = "#4c4f69"
linkColor = "#1e66f5"
borderColor = "#ccd0da"
codeTextColor = "#4c4f69"
dataframeBorderColor = "#ccd0da"
dataframeHeaderBackgroundColor = "#e6e9ef"

[theme.light.sidebar]
backgroundColor = "#e6e9ef"
secondaryBackgroundColor = "#dce0e8"
codeBackgroundColor = "#dce0e8"
textColor = "#4c4f69"
borderColor = "#ccd0da"
primaryColor = "#1e66f5"
dataframeHeaderBackgroundColor = "#dce0e8"
dataframeBorderColor = "#ccd0da"

[theme.dark]
# Catppuccin Mocha
primaryColor = "#89b4fa"
backgroundColor = "#1e1e2e"
secondaryBackgroundColor = "#181825"
codeBackgroundColor = "#313244"
textColor = "#cdd6f4"
linkColor = "#89b4fa"
borderColor = "#45475a"
codeTextColor = "#cdd6f4"
dataframeBorderColor = "#45475a"
dataframeHeaderBackgroundColor = "#313244"

[theme.dark.sidebar]
backgroundColor = "#181825"
secondaryBackgroundColor = "#1e1e2e"
codeBackgroundColor = "#313244"
textColor = "#cdd6f4"
borderColor = "#45475a"
primaryColor = "#89b4fa"
dataframeHeaderBackgroundColor = "#313244"
dataframeBorderColor = "#45475a"
