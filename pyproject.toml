[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "r9-analytics"
version = "1.4.0"
requires-python = ">=3.12"
dependencies = [
    "psycopg>=3.3.5",
    "pyyaml>=6.0.3",
    "yfinance>=1.7.0",
    "streamlit>=1.63.0",
    "plotly>=7.0.0",
    "pandas>=3.0.5",
    "numpy>=2.2",
    "scipy>=1.15.0",
]

[tool.setuptools.packages.find]
include = ["shared*", "dashboard*", "cli*"]
